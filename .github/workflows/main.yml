name: c1
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Récupération du code
      uses: Actions/checkout@v4 
    - name: Installer Node.js
      uses: action/setup-node@v4
      with: 
        node-version: 20
    - name: Installler les dépendances
      run: npm install
    - name: Lancer les tests
      run: npm tests
    - name: Construire le projet
      run: npm run build
